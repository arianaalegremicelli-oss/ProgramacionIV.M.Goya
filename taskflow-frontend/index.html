<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TaskFlow - Frontend</title>
  <style>
    body { font-family: sans-serif; max-width: 750px; margin: 40px auto; padding: 0 16px; background-color: #fafafa; }
    h1 { color: #333; }
    input, select, button { padding: 8px 12px; margin: 4px 0; font-size: 14px; }
    button { cursor: pointer; background: #0066cc; color: #fff; border: none; border-radius: 4px; }
    button:hover { background: #0052a3; }
    #logout-btn { background: #cc3300; margin-left: 10px; }
    #tasks { list-style-type: none; padding: 0; }
    #tasks li { background: #fff; border: 1px solid #ddd; padding: 10px; margin: 8px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
    .status-pill { font-size: 12px; padding: 3px 8px; border-radius: 12px; background: #e0e0e0; }
    .error { color: #cc0000; font-weight: bold; }
    .pagination-bar { margin-top: 15px; display: flex; gap: 10px; align-items: center; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <h1>TaskFlow</h1>

  <section id="login-box">
    <h2>Ingresar al Sistema</h2>
    <input id="username" placeholder="Usuario" autocomplete="username"><br>
    <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password"><br>
    <button onclick="login()">Ingresar</button>
    <p id="login-error" class="error"></p>
  </section>

  <section id="app-box" style="display:none;">
    <div class="header-bar">
      <h2>Mis tareas</h2>
      <button id="logout-btn" onclick="logout()">Cerrar Sesión</button>
    </div>

    <ul id="tasks"></ul>

    <div class="pagination-bar">
      <button id="prev-btn" onclick="loadPreviousPage()" disabled>Anterior</button>
      <span id="page-info">Página 1</span>
      <button id="next-btn" onclick="loadNextPage()" disabled>Siguiente</button>
    </div>

    <hr style="margin: 25px 0;">

    <h3>Nueva Tarea</h3>
    <select id="project"></select><br>
    <input id="new-title" placeholder="Título de la tarea" style="width: 70%;"><br>
    <button onclick="createTask()">Agregar Tarea</button>
    <p id="app-error" class="error"></p>
  </section>

  <script src="app.js"></script>
</body>
</html>
